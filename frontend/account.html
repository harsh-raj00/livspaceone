<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>My Account | LivspaceOne</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    
    <link rel="stylesheet" href="css/fontawesome/all.min.css">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body style="display:none">
    <div id="navbar-container"></div>
    <div id="modals-container"></div>

    <main class="pt-24 pb-20" data-page="account">
        <div class="max-w-4xl mx-auto px-6 reveal">
            
            <div class="glass-card p-10 mt-10 relative overflow-hidden">
                <div class="ambient-glow ambient-gold" style="top:-100px;right:-100px;opacity:0.05"></div>
                
                <div class="flex flex-col md:flex-row items-center gap-8 relative z-10">
                    <div class="w-32 h-32 rounded-full border-[3px] border-[rgba(255,255,255,0.3)] flex items-center justify-center bg-[rgba(0,0,0,0.03)] shadow-[0_0_30px_rgba(255,255,255,0.1)]">
                        <i class="fas fa-user text-5xl text-[#000000]"></i>
                    </div>
                    <div class="text-center md:text-left flex-1">
                        <h1 class="text-3xl font-bold mb-1 text-[#000000]" id="accName">Loading...</h1>
                        <p class="text-[#525252] mb-6" id="accEmail">Loading...</p>
                        
                        <div class="flex flex-wrap gap-4 justify-center md:justify-start">
                            <a href="orders.html" class="bg-[rgba(255,255,255,0.04)] border border-[rgba(0,0,0,0.12)] px-5 py-2.5 rounded-lg text-sm font-medium hover:bg-[rgba(255,255,255,0.1)] hover:border-[#FFFFFF] hover:text-[#000000] transition-all">
                                <i class="fas fa-box mr-2"></i> Collection Orders
                            </a>
                            <a href="bookings.html" class="bg-[rgba(255,255,255,0.04)] border border-[rgba(0,0,0,0.12)] px-5 py-2.5 rounded-lg text-sm font-medium hover:bg-[rgba(255,255,255,0.1)] hover:border-[#FFFFFF] hover:text-[#000000] transition-all">
                                <i class="fas fa-calendar-check mr-2"></i> Appointments
                            </a>
                        </div>
                    </div>
                </div>
                
                <div class="mt-12 pt-8 border-t border-[rgba(0,0,0,0.1)] grid md:grid-cols-2 gap-8 relative z-10">
                    <div>
                        <h3 class="font-bold mb-4 text-[#000000]"><i class="fas fa-map-marker-alt text-[#000000] mr-2"></i> Saved Addresses</h3>
                        <div class="bg-[rgba(0,0,0,0.02)] border border-[rgba(0,0,0,0.08)] p-4 rounded-xl">
                            <p class="text-sm text-[#525252]">No saved addresses yet.</p>
                            <button class="text-[#000000] text-sm font-medium mt-3 hover:underline">Add New Address</button>
                        </div>
                    </div>
                    <div>
                        <h3 class="font-bold mb-4 text-[#000000]"><i class="fas fa-credit-card text-[#000000] mr-2"></i> Payment Methods</h3>
                        <div class="bg-[rgba(0,0,0,0.02)] border border-[rgba(0,0,0,0.08)] p-4 rounded-xl">
                            <p class="text-sm text-[#525252]">No saved payment methods.</p>
                            <button class="text-[#000000] text-sm font-medium mt-3 hover:underline">Add Card</button>
                        </div>
                    </div>
                </div>
                
                <div class="mt-8 text-center md:text-right relative z-10">
                    <button onclick="logout()" class="text-red-400 font-medium text-sm hover:text-red-300 transition-colors"><i class="fas fa-sign-out-alt mr-1"></i> Sign Out securely</button>
                </div>
            </div>
            
        </div>
    </main>

    <div id="footer-container"></div>
    <script src="js/api.js?v=12"></script>
    <script src="js/main.js?v=12"></script>
    <script src="js/app.js?v=12"></script>
    <script src="js/pages.js?v=12"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if(!requireLogin('view account')) {
                window.location.href = 'index.html';
                return;
            }
            renderAccountPage();
        });
    </script>
</body>
</html>
