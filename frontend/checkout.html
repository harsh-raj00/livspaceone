<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Secure Checkout | LivspaceOne</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    
    <link rel="stylesheet" href="css/fontawesome/all.min.css">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body style="display:none">
    <div id="navbar-container"></div>
    <div id="modals-container"></div>

    <main class="pt-24 pb-20" data-page="checkout">
        <div class="max-w-6xl mx-auto px-6 reveal">
            <h1 class="text-3xl font-bold mb-10" style="font-family:'Outfit',sans-serif">Secure Checkout</h1>
            
            <div class="grid md:grid-cols-2 gap-12">
                <!-- Details -->
                <div class="space-y-8">
                    <div class="glass-card p-8">
                        <h3 class="font-bold text-xl mb-6 flex items-center gap-2"><i class="fas fa-map-marker-alt text-[#000000]"></i> Shipping Details</h3>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-[#525252] mb-1">Full Name</label>
                                <input type="text" id="checkoutName" class="w-full bg-[rgba(0,0,0,0.03)] border border-[rgba(0,0,0,0.1)] rounded-xl py-3 px-4 text-[#000000] focus:outline-none focus:border-[#FFFFFF] transition">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-[#525252] mb-1">Phone Number</label>
                                <input type="tel" id="checkoutPhone" class="w-full bg-[rgba(0,0,0,0.03)] border border-[rgba(0,0,0,0.1)] rounded-xl py-3 px-4 text-[#000000] focus:outline-none focus:border-[#FFFFFF] transition">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-[#525252] mb-1">Detailed Address</label>
                                <textarea id="checkoutAddress" class="w-full bg-[rgba(0,0,0,0.03)] border border-[rgba(0,0,0,0.1)] rounded-xl py-3 px-4 text-[#000000] focus:outline-none focus:border-[#FFFFFF] transition resize-none h-24"></textarea>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-[#525252] mb-1">City</label>
                                    <input type="text" id="checkoutCity" class="w-full bg-[rgba(0,0,0,0.03)] border border-[rgba(0,0,0,0.1)] rounded-xl py-3 px-4 text-[#000000] focus:outline-none focus:border-[#FFFFFF] transition">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-[#525252] mb-1">Postal Code</label>
                                    <input type="text" id="checkoutPin" class="w-full bg-[rgba(0,0,0,0.03)] border border-[rgba(0,0,0,0.1)] rounded-xl py-3 px-4 text-[#000000] focus:outline-none focus:border-[#FFFFFF] transition">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="glass-card p-8">
                        <h3 class="font-bold text-xl mb-6 flex items-center gap-2"><i class="fas fa-credit-card text-[#000000]"></i> Payment Method</h3>
                        <div class="space-y-3">
                            <label class="flex items-center gap-3 p-4 border border-[rgba(255,255,255,0.3)] bg-[rgba(0,0,0,0.05)] rounded-xl cursor-pointer">
                                <input type="radio" name="payment" value="cod" checked class="accent-[#FFFFFF]">
                                <span class="font-medium text-[#000000]">Pay on Delivery (Cash/UPI)</span>
                            </label>
                            <label class="flex items-center gap-3 p-4 border border-[rgba(0,0,0,0.1)] bg-[rgba(0,0,0,0.02)] rounded-xl cursor-pointer opacity-60">
                                <input type="radio" name="payment" value="online" disabled>
                                <div>
                                    <span class="font-medium text-[#000000] block">Credit Card / UPI</span>
                                    <span class="text-xs text-[#525252]">Coming soon</span>
                                </div>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Summary -->
                <div>
                    <div class="glass-card p-8 sticky top-24 gold-border">
                        <h3 class="font-bold text-xl mb-6">Order Summary</h3>
                        <div id="checkoutItems" class="space-y-4 max-h-[300px] overflow-y-auto pr-2 custom-scroll mb-6">
                            <!-- Items go here -->
                        </div>
                        <div class="space-y-3 pt-6 border-t border-[rgba(0,0,0,0.1)] mb-6 text-sm">
                            <div class="flex justify-between text-[#525252]"><span>Subtotal</span><span id="checkoutSubtotal">₹0</span></div>
                            <div class="flex justify-between text-[#525252]"><span>Shipping</span><span class="text-green-400">Complimentary</span></div>
                            <div class="flex justify-between text-[#000000] font-bold text-lg pt-3 border-t border-[rgba(0,0,0,0.1)]"><span>Total</span><span id="checkoutTotal" class="text-[#000000]">₹0</span></div>
                        </div>
                        <button onclick="placeOrder()" class="btn-primary w-full py-4 text-base">Complete Purchase <i class="fas fa-lock ml-1 text-sm"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>
    <script src="js/api.js?v=12"></script>
    <script src="js/main.js?v=12"></script>
    <script src="js/app.js?v=12"></script>
    <script src="js/pages.js?v=12"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderCheckoutPage();
        });
    </script>
</body>
</html>
