<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Create Account | LivspaceOne</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    
    <link rel="stylesheet" href="css/fontawesome/all.min.css">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body style="display:none">
    <div id="navbar-container"></div>
    <div id="modals-container"></div>
    
    <main class="pt-24 min-h-screen flex items-center justify-center px-6 relative" data-page="register">
        <div class="ambient-glow ambient-gold" style="bottom:10%;right:10%;"></div>
        
        <div class="glass-card max-w-md w-full p-10 gold-border relative z-10" style="animation:bounceIn 0.4s ease-out">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gradient-to-br from-[#FFFFFF] to-[#E5E5E5] rounded-2xl mx-auto flex items-center justify-center mb-6 shadow-lg shadow-[rgba(0,0,0,0.1)]">
                    <i class="fas fa-user-plus text-2xl text-[#000000]"></i>
                </div>
                <h1 class="text-3xl font-bold text-[#000000]" style="font-family:'Outfit',sans-serif">Join LivspaceOne</h1>
                <p class="text-[#525252] text-sm mt-2">Create an account to unlock premium features.</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-[#525252] mb-1">Full Name</label>
                    <input type="text" id="regNamePage" placeholder="Daniel Hayes" class="w-full bg-[rgba(0,0,0,0.03)] border border-[rgba(0,0,0,0.1)] rounded-xl py-3 px-4 text-[#000000] focus:outline-none focus:border-[#FFFFFF] transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-[#525252] mb-1">Email Address</label>
                    <input type="email" id="regEmailPage" placeholder="name@company.com" class="w-full bg-[rgba(0,0,0,0.03)] border border-[rgba(0,0,0,0.1)] rounded-xl py-3 px-4 text-[#000000] focus:outline-none focus:border-[#FFFFFF] transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-[#525252] mb-1">Phone Number</label>
                    <input type="tel" id="regPhonePage" placeholder="+91 98765 43210" class="w-full bg-[rgba(0,0,0,0.03)] border border-[rgba(0,0,0,0.1)] rounded-xl py-3 px-4 text-[#000000] focus:outline-none focus:border-[#FFFFFF] transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-[#525252] mb-1">Security Key</label>
                    <input type="password" id="regPasswordPage" placeholder="Min. 8 characters" class="w-full bg-[rgba(0,0,0,0.03)] border border-[rgba(0,0,0,0.1)] rounded-xl py-3 px-4 text-[#000000] focus:outline-none focus:border-[#FFFFFF] transition-all">
                </div>
                
                <button onclick="handleRegisterPage()" class="btn-primary w-full py-4 text-base mt-4 shadow-[0_8px_20px_rgba(0,0,0,0.1)]">Create Account</button>
            </div>
            
            <div class="mt-8 text-center border-t border-[rgba(0,0,0,0.1)] pt-6">
                <p class="text-sm text-[#525252]">Already registered? <a href="login.html" class="text-[#000000] font-bold">Sign In</a></p>
            </div>
        </div>
    </main>
    
    <div id="footer-container"></div>
    <script src="js/api.js?v=12"></script>
    <script src="js/main.js?v=12"></script>
    <script src="js/app.js?v=12"></script>
    <script src="js/pages.js?v=12"></script>
</body>
</html>
