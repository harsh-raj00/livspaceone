<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Certified Professionals | LivspaceOne</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    
    <link rel="stylesheet" href="css/fontawesome/all.min.css">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body style="display:none">
    <div id="navbar-container"></div>
    <div id="modals-container"></div>

    <main class="pt-24 pb-20" data-page="services">
        <div class="max-w-7xl mx-auto px-6">
            
            <div class="flex flex-col md:flex-row justify-between items-end mb-8 gap-4 reveal active">
                <div>
                    <h1 class="text-3xl font-bold" style="font-family:'Outfit',sans-serif">Certified Professionals</h1>
                    <p class="text-[#525252] text-sm mt-1">Engage with verified architects, designers, and specialists.</p>
                </div>
                
                <div class="flex flex-wrap gap-3 w-full md:w-auto">
                    <div class="relative flex-1 md:w-64">
                        <input type="text" id="workerSearch" onkeyup="filterWorkers()" placeholder="Search experts by name or role..." 
                            class="w-full bg-[rgba(0,0,0,0.03)] border border-[rgba(0,0,0,0.1)] rounded-full py-2.5 px-4 pl-10 text-sm focus:outline-none focus:border-[#FFFFFF] transition">
                        <i class="fas fa-search absolute left-4 top-3.5 text-[#555] text-sm"></i>
                    </div>
                    <select id="cityFilter" onchange="filterWorkers()" class="bg-[rgba(0,0,0,0.03)] border border-[rgba(0,0,0,0.1)] rounded-full py-2.5 px-4 text-sm focus:outline-none focus:border-[#FFFFFF] transition appearance-none">
                        <option value="">All Regions</option>
                        <option value="Mumbai">Mumbai</option>
                        <option value="Bangalore">Bangalore</option>
                        <option value="Dubai">Dubai</option>
                        <option value="Bihar Sharif">Bihar Sharif</option>
                    </select>
                    <select id="serviceTypeFilter" onchange="filterWorkers()" class="bg-[rgba(0,0,0,0.03)] border border-[rgba(0,0,0,0.1)] rounded-full py-2.5 px-4 text-sm focus:outline-none focus:border-[#FFFFFF] transition appearance-none">
                        <option value="">All Roles</option>
                        <option value="Architect">Architect</option>
                        <option value="Interior Designer">Interior Designer</option>
                        <option value="Electrician">Electrician</option>
                        <option value="Plumber">Plumber</option>
                        <option value="Carpenter">Carpenter</option>
                    </select>
                </div>
            </div>

            <!-- Professionals Grid -->
            <div id="servicesWorkerGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5 reveal">
                <!-- Dynamically populated by JS -->
            </div>
            
        </div>
    </main>

    <div id="footer-container"></div>
    <script src="js/api.js?v=12"></script>
    <script src="js/main.js?v=12"></script>
    <script src="js/app.js?v=12"></script>
    <script src="js/pages.js?v=12"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const r = urlParams.get('role');
            if(r) {
                const sf = document.getElementById('serviceTypeFilter');
                if(sf) { sf.value = r; }
            }
        });
    </script>
</body>
</html>
