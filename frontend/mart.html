<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>LuxeBuild Collections | LivspaceOne</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    
    <link rel="stylesheet" href="css/fontawesome/all.min.css">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body style="display:none">
    <div id="navbar-container"></div>
    <div id="modals-container"></div>

    <main class="pt-24 pb-20" data-page="mart">
        <div class="max-w-7xl mx-auto px-6">
            
            <div class="text-center mb-10 reveal active">
                <h1 class="text-3xl font-bold" style="font-family:'Outfit',sans-serif">LuxeBuild Collections</h1>
                <p class="text-[#525252] text-sm mt-1 max-w-xl mx-auto">Discover premium architectural materials, bespoke decor, and smart home solutions curated for luxury spaces.</p>
            </div>

            <!-- Category Chips -->
            <div class="flex gap-3 overflow-x-auto pb-4 mb-6 scrollbar-hide reveal" id="categoryFilter" style="scrollbar-width:none">
                <div class="category-chip active whitespace-nowrap" data-cat="all">Explore All</div>
                <div class="category-chip whitespace-nowrap" data-cat="electrical">Electrical & Smart</div>
                <div class="category-chip whitespace-nowrap" data-cat="plumbing">Premium Plumbing</div>
                <div class="category-chip whitespace-nowrap" data-cat="hardware">Designer Hardware</div>
                <div class="category-chip whitespace-nowrap" data-cat="paints">Luxury Paints</div>
                <div class="category-chip whitespace-nowrap" data-cat="flooring">Premium Flooring</div>
                <div class="category-chip whitespace-nowrap" data-cat="construction">Construction Core</div>
            </div>

            <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 reveal">
                <div class="relative w-full md:w-80">
                    <input type="text" id="productSearch" onkeyup="renderMartPage(document.querySelector('.category-chip.active')?.dataset.cat || 'all')" placeholder="Search premium collections..." 
                        class="w-full bg-[rgba(0,0,0,0.03)] border border-[rgba(0,0,0,0.1)] rounded-full py-2.5 px-4 pl-10 text-sm focus:outline-none focus:border-[#FFFFFF] transition">
                    <i class="fas fa-search absolute left-4 top-3.5 text-[#555] text-sm"></i>
                </div>
                <select id="sortProducts" onchange="renderMartPage(document.querySelector('.category-chip.active')?.dataset.cat || 'all')" class="bg-[rgba(0,0,0,0.03)] border border-[rgba(0,0,0,0.1)] rounded-full py-2.5 px-4 text-sm focus:outline-none focus:border-[#FFFFFF] transition appearance-none min-w-[160px]">
                    <option value="">Sort by Relevance</option>
                    <option value="priceLow">Price: Low to High</option>
                    <option value="priceHigh">Price: High to Low</option>
                    <option value="rating">Top Rated</option>
                </select>
            </div>

            <!-- Products Grid -->
            <div id="productsGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5 reveal">
                <!-- Dynamically populated by JS -->
            </div>
            
        </div>
    </main>

    <div id="footer-container"></div>
    <script src="js/api.js?v=12"></script>
    <script src="js/main.js?v=12"></script>
    <script src="js/app.js?v=12"></script>
    <script src="js/pages.js?v=12"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const c = urlParams.get('cat');
            if(c) {
                setTimeout(() => {
                    const chip = document.querySelector(`.category-chip[data-cat="${c}"]`);
                    if(chip) chip.click();
                }, 100);
            }
        });
    </script>
</body>
</html>
